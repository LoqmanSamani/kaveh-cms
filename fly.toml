# Fly.io: fly launch --copy-config --no-deploy && fly volumes create kcms_data --size 1 && fly deploy
app = "kaveh-cms"
primary_region = "fra"

[build]

[env]
  KCMS_DATA_DIR = "/data"

[mounts]
  source = "kcms_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
